# Phase 0 scenarios. One baseline with no fault, then one scenario per fault kind.
# Fault parameters are ranges; each (scenario, seed) draws its own values.
scenarios:
  - id: baseline
    description: Nominal insertion, no injected fault.

  - id: controller_stall
    description: The arm controller stops executing commands for a while.
    faults:
      - kind: controller_stall
        onset_s: [0.5, 2.0]
        duration_s: [3.0, 12.0]

  - id: sensor_dropout
    description: The wrist force/torque sensor stops reporting valid data for a while.
    faults:
      - kind: sensor_dropout
        onset_s: [1.0, 4.0]
        duration_s: [0.5, 1.0]

  - id: obstacle
    description: Something blocks the port part-way down; the plug sticks under rising force.
    faults:
      - kind: obstacle
        depth_mm: [2.0, 6.0]
        attempts: [1, 3]  # insertions it blocks; setting B retries at most twice

  - id: tight_fit
    description: The port is too tight below some depth; at nominal speed the force exceeds 20 N.
    faults:
      - kind: tight_fit
        onset_depth_mm: [1.0, 3.0]
        force_n_per_mm_s: [5.5, 7.5]

  - id: pose_shift
    description: The port moves sideways after alignment, as the plug descends to insert.
    faults:
      - kind: pose_shift
        trigger_height_mm: [0.5, 3.0]
        shift_mm: [2.0, 4.0]
        attempts: [1, 3]  # descents on which the port shifts; setting B re-aligns at most twice

  - id: yaw_mismatch
    description: >-
      The plug is rotated against the port and wedges half-way: moderate force, high torque.
      No Monitor rule describes it, so it is classified UNKNOWN. Twisting the plug into line
      frees it; insert_scripted does not twist, insert_act does.
    faults:
      - kind: yaw_mismatch
        stall_depth_mm: [3.0, 5.0]
        force_n: [6.0, 9.0]
        torque_nm: [0.4, 0.8]
        yaw_deg: [5.0, 15.0]
