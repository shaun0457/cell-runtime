[project]
name = "cell-runtime"
version = "0.0.1"
description = "Agent runtime for a robotic work cell: failure detection, recovery and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Shaun Chen" }]
dependencies = [
    "py_trees>=2.2,<3",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
]

[project.scripts]
cellrt = "cellrt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cellrt"]

[tool.uv]
# Same interpreter build locally and in CI; never a system or conda Python.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The core must stay ROS-free (CLAUDE.md, design principle 3). A banned module also bans its
# submodules. tests/test_ros_boundary.py is the complete check; this list catches it in the editor.
"rclpy".msg = "ROS belongs in adapters/, not in the core"
"std_msgs".msg = "ROS belongs in adapters/, not in the core"
"geometry_msgs".msg = "ROS belongs in adapters/, not in the core"
"sensor_msgs".msg = "ROS belongs in adapters/, not in the core"
"tf2_ros".msg = "ROS belongs in adapters/, not in the core"
"aic_model".msg = "AIC belongs in adapters/, not in the core"
"aic_interfaces".msg = "AIC belongs in adapters/, not in the core"
# Determinism: time only comes from the injected Clock (CLAUDE.md, design principle 5).
# Applies to tests too, on purpose: tests drive the simulated clock. Real-time exceptions are
# per file below. Not caught here: `loop.time()` (a method call) — never use it in the core.
"asyncio.sleep".msg = "use Clock.sleep: core time is simulated"
"asyncio.wait_for".msg = "check skill timeouts against the Clock, not the event loop's clock"
"asyncio.timeout".msg = "check skill timeouts against the Clock, not the event loop's clock"
"asyncio.timeout_at".msg = "check skill timeouts against the Clock, not the event loop's clock"
"time.sleep".msg = "use Clock.sleep: core time is simulated"
"time.time".msg = "use Clock.now: core time is simulated"
"time.time_ns".msg = "use Clock.now: core time is simulated"
"time.monotonic".msg = "use Clock.now: core time is simulated"
"time.monotonic_ns".msg = "use Clock.now: core time is simulated"
"time.perf_counter".msg = "use Clock.now: core time is simulated"
"time.perf_counter_ns".msg = "use Clock.now: core time is simulated"
"datetime.datetime.now".msg = "use Clock.now: core time is simulated"
"datetime.datetime.utcnow".msg = "use Clock.now: core time is simulated"

[tool.ruff.lint.per-file-ignores]
# Adapters are where ROS lives.
"adapters/**" = ["TID251"]
# wall_ts is real time by design (debugging only, never folded).
"cellrt/runtime/recorder.py" = ["TID251"]
# drain() yields to the loop with asyncio.sleep(0); it never waits real time.
"cellrt/executor/runner.py" = ["TID251"]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    # Formatter output can change between minor versions: pin the minor.
    "ruff>=0.17.4,<0.18",
]
